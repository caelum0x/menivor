# Alembic configuration for ReelForge persistence layer.
# The database URL is intentionally NOT set here; migrations/env.py resolves it
# at runtime from config.neon.database_url (falling back to $NEON_DATABASE_URL)
# so no secrets live in this file.

[alembic]
# Path to migration scripts, relative to the project root.
script_location = migrations

# Template used to generate migration file names; %%(rev)s and %%(slug)s are
# substituted by Alembic. Timestamped prefix keeps versions ordered on disk.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Use OS-native path separators when writing version files.
prepend_sys_path = ./apps/api:.

# Timezone for file_template timestamps.
timezone = UTC

# Max length of the truncated slug in generated filenames.
truncate_slug_length = 40

# sqlalchemy.url is populated dynamically in env.py; left blank here on purpose.
sqlalchemy.url =

[post_write_hooks]
# Optional: run ruff/black on generated migrations. Disabled by default.
# hooks = ruff
# ruff.type = console_scripts
# ruff.entrypoint = ruff
# ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
