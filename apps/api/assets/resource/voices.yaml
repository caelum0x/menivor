# ReelForge curated voice catalog (CTO plan §4 / §5.2).
#
# Served by GET /v1/voices as the default, human-friendly voice list.
#
# NOTE ON THE VOICE IDs BELOW
# ---------------------------
# These are well-known *public* ElevenLabs demo voice IDs (Rachel, Adam,
# Antoni, Bella, Domi, Elli). They are provided as sensible DEFAULTS ONLY and
# should be curated / verified against your own ElevenLabs workspace before
# production use. Every id here is OVERRIDABLE: replace the `id` values (or the
# whole file) with voices from your account. If this file is missing or invalid
# the API falls back to listing voices live from the ElevenLabs account.
#
# The three multilingual voices are Turkish-capable via the ElevenLabs
# multilingual v2 model; the three English voices are tuned for en-US delivery.
#
# Schema (each entry):
#   id:          ElevenLabs voice_id
#   name:        human-friendly display name
#   language:    one of 'tr' | 'en' | 'multi'
#   gender:      'male' | 'female'
#   description: short blurb shown in the UI

voices:
