cancel_url = ""

[polar]
# Polar (polar.sh) — merchant-of-record checkout. Dashboard: https://polar.sh/
# access_token: organization access token (polar_oat_...).
# webhook_secret: signing secret for the checkout webhook.
access_token = ""
webhook_secret = ""
# Prebuilt Polar Price ids for the purchasable packs.
starter_price_id = ""
pro_price_id = ""
# Hosted Checkout redirect targets.
success_url = ""
cancel_url = ""

[revenuecat]
# Native-app entitlement verification. This key is SECRET and server-only.
# The Expo app uses separate public, app-specific SDK keys.
secret_api_key = ""
entitlement_id = "pro"
api_base_url = "https://api.revenuecat.com/v1"
