pro_amount = ""

[creem]
# Creem (creem.io) — merchant-of-record checkout. Dashboard: https://creem.io/
# api_key: server-side API key (creem_...).
# webhook_secret: signing secret for the checkout webhook.
api_key = ""
webhook_secret = ""
# Prebuilt Creem Product ids for the purchasable packs (prod_...).
