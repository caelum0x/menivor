# =============================================================================
# Error Monitoring / Sentry
# =============================================================================
# Optional. Leave dsn empty to disable Sentry entirely (the app runs as a NO-OP,
# no key required to ship). dsn / environment can also be supplied via the
# SENTRY_DSN / SENTRY_ENVIRONMENT environment variables, which take precedence.

[sentry]
# Sentry project DSN, e.g. https://<key>@<org>.ingest.sentry.io/<project>.
dsn = ""
# Deployment environment tag reported to Sentry (e.g. "production", "staging").
environment = ""
# Performance-tracing sample rate in [0.0, 1.0]. 0.0 = errors only (no tracing).
traces_sample_rate = 0.0

# =============================================================================
# WebUI Preferences / WebUI 偏好
# =============================================================================

[ui]
# Hide generation logs in the WebUI.
hide_log = false

# The WebUI writes the remaining preferences automatically. Uncomment values
# below only when you want to define initial defaults manually.
# language = "zh"
# tts_server = "azure-tts-v1"
# voice_name = ""
# font_name = "MicrosoftYaHeiBold.ttc"
# font_size = 60
# text_fore_color = "#FFFFFF"
# subtitle_position = "bottom" # "top", "center", "bottom", or "custom"
# custom_position = 70.0       # Percentage from the top when using "custom"
# subtitle_background_enabled = false
# subtitle_background_color = "#000000"
# rounded_subtitle_background = false
